<!doctype html><html><head><meta charset="utf-8">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>html,body{margin:0;background:#FF00FF}model-viewer{width:900px;height:560px;background:#FF00FF;--poster-color:#FF00FF}</style></head>
<body><model-viewer id="mv" src="" camera-orbit="" field-of-view="24deg" exposure="1.1" shadow-intensity="0" environment-image="neutral" interaction-prompt="none"><div slot="progress-bar"></div></model-viewer>
<script>const q=new URLSearchParams(location.search);const mv=document.getElementById('mv');mv.setAttribute('src',q.get('src'));mv.setAttribute('camera-orbit',q.get('orbit')||'35deg 72deg auto');if(q.get('exp'))mv.setAttribute('exposure',q.get('exp'));</script>
</body></html>
